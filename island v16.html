<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light" />
  <title>MD3 Spring Island — v13 (меню с вкладками)</title>
  <style>
    :root {
      --page: #ffffff;
      --ink: #111216;
      --yellow: #d5c66f;
      --green: #c4e5b8;
      --green-hover: #d1ebc7;
      --icon-size: 31px;
      --tab-height: 62%;
      --action-width: 78%;
      --action-radius: 18px;
      --hover-opacity: .78;
      --press-scale: .88;
      --slider-active: #c4c6ae;
      --slider-inactive: #4a4a44;
      --slider-thumb: #b9bba3;
    }

    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      height: 100svh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--page);
      color: var(--ink);
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    /* ---------- Панель параметров ---------- */
    .panel {
      flex: none;
      display: flex;
      flex-direction: column;
      max-height: 50svh;
      background: var(--page);
      color: var(--ink);
      border-bottom: 1px solid #e6e8ee;
      font-size: 13px;
    }
    .panel-head {
      flex: none;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 8px;
      padding: 10px 14px;
      border-bottom: 1px solid #eef0f4;
    }
    .panel-title { font-weight: 600; }
    .panel-actions { display: flex; flex-wrap: wrap; gap: 6px; }
    .btn {
      font: inherit;
      font-size: 12px;
      padding: 6px 10px;
      border: 1px solid #d6d9e0;
      border-radius: 8px;
      background: transparent;
      color: var(--ink);
      cursor: pointer;
    }
    .btn:hover { background: rgba(127, 127, 127, .12); }
    .btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
    .panel-body {
      flex: 1 1 auto;
      min-height: 0;
      overflow-y: auto;
      padding: 4px 14px 14px;
    }
    .panel-body[hidden] { display: none; }
    .mp-subhead { margin: 12px 0 4px; font-weight: 600; font-size: 12px; opacity: .55; text-transform: uppercase; letter-spacing: .04em; }
    .group { border-bottom: 1px solid #f1f2f5; }
    .group > summary {
      padding: 10px 0;
      cursor: pointer;
      font-weight: 600;
      list-style: none;
    }
    .group > summary::-webkit-details-marker { display: none; }
    .group > summary::after { content: "▾"; float: right; opacity: .45; }
    .group:not([open]) > summary::after { content: "▸"; }
    .row {
      display: grid;
      grid-template-columns: minmax(0, 1.1fr) minmax(0, 1.4fr) 58px;
      align-items: center;
      gap: 10px;
      padding: 5px 0;
    }
    .row label { opacity: .85; }
    .row input[type="range"] { width: 100%; margin: 0; accent-color: var(--ink); }
    .row input[type="checkbox"] { justify-self: start; width: 16px; height: 16px; margin: 0; accent-color: var(--ink); }
    .row input[type="color"] {
      width: 100%;
      height: 26px;
      padding: 0;
      border: 1px solid #d6d9e0;
      border-radius: 6px;
      background: none;
      cursor: pointer;
    }
    .row output {
      text-align: right;
      font-variant-numeric: tabular-nums;
      opacity: .6;
    }
    .export {
      margin: 12px 0 0;
      padding: 10px;
      border-radius: 8px;
      background: rgba(127, 127, 127, .1);
      font-size: 11px;
      white-space: pre-wrap;
      word-break: break-all;
      max-height: 180px;
      overflow: auto;
      user-select: all;
    }
    .export[hidden] { display: none; }
    @media (max-width: 520px) {
      .row { grid-template-columns: 1fr auto; }
      .row input[type="range"],
      .row input[type="color"] { grid-column: 1 / -1; grid-row: 2; }
    }

    /* ---------- Остров ---------- */
    .demo {
      flex: 1 1 auto;
      min-height: 0;
      display: flex;
      justify-content: center;
      align-items: flex-end;
      padding-bottom: max(24px, env(safe-area-inset-bottom));
    }
    .island-wrap {
      width: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    /* Ширина и высота задаются из JS. Сжатие и подъём при нажатии — трансформацией острова. */
    .island {
      position: relative;
      isolation: isolate;
      display: grid;
      grid-template-columns: repeat(5, minmax(0, 1fr));
      align-items: stretch;
      padding: 8px;
      background: transparent;
      transform-origin: 50% 50%;
      will-change: transform;
      -webkit-tap-highlight-color: transparent;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .island-shape {
      position: absolute;
      z-index: 0;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .island-shape path { fill: var(--ink); }

    /* Индикатор двигается через transform (композитор), а не через left. */
    .indicator {
      position: absolute;
      z-index: 1;
      top: 40%;
      bottom: 8px;
      left: 0;
      width: 2px;
      background: var(--yellow);
      border-radius: 3px;
      pointer-events: none;
      will-change: transform, width, border-radius;
    }

    /* Морф углов: индикатор на время анимации рисуется как фигура с четырьмя независимыми углами. */
    .indicator-morph {
      position: absolute;
      z-index: 1;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .indicator-morph path { fill: var(--yellow); }

    .island.is-grabbable,
    .island.is-grabbable .tab { cursor: grab; }
    .island.is-dragging,
    .island.is-dragging .tab { cursor: grabbing; }

    .tab, .action {
      position: relative;
      z-index: 2;
      min-width: 0;
      padding: 0;
      border: 0;
      color: #fff;
      display: grid;
      place-items: center;
      background: transparent;
      cursor: pointer;
      appearance: none;
      outline: none;
    }

    .tab {
      align-self: end;
      height: var(--tab-height);
      border-radius: 0;
    }
    .tab svg, .action svg {
      width: var(--icon-size);
      height: var(--icon-size);
      display: block;
    }
    .tab svg { overflow: visible; }

    .tab:focus-visible .icon-frame,
    .action:focus-visible .action-frame {
      outline: 2px solid #fff;
      outline-offset: 3px;
    }

    .icon-frame {
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      border-radius: 3px;
      transition: opacity 160ms ease;
    }
    .tab[aria-current="true"] .icon-frame { opacity: 1; }
    .tab:not([aria-current="true"]):hover .icon-frame { opacity: var(--hover-opacity); }

    .action {
      z-index: 3;
      justify-self: center;
      align-self: end;
      width: var(--action-width);
      height: calc(100% - 18px);
      margin-bottom: -8px;
      overflow: hidden;
      color: #fff;
      background: transparent;
      border-radius: var(--action-radius) var(--action-radius) 0 0;
      isolation: isolate;
    }
    /* Когда плюс спрятан, он не перехватывает указатель. */
    .action.is-hidden { pointer-events: none; }

    .action-panel {
      position: absolute;
      z-index: 0;
      inset: 0;
      border-radius: inherit;
      background: var(--green);
      transform: translateY(0%);
      will-change: transform;
      pointer-events: none;
    }
    .action:hover .action-panel { background: var(--green-hover); }
    .action-frame {
      position: relative;
      z-index: 1;
      display: grid;
      place-items: center;
      width: 100%;
      height: 100%;
      transform: translateY(0%);
      will-change: transform;
      pointer-events: none;
    }
    .action:active svg { transform: scale(var(--press-scale)); }
    .action svg { transition: transform 180ms cubic-bezier(.2,.8,.2,1); }

    /* Ползунок на верхней грани: все цвета непрозрачные */
    .slider-svg {
      position: absolute;
      z-index: 4;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: visible;
      pointer-events: none;
    }
    .track-active,
    .track-inactive { fill: none; stroke-linecap: round; }
    .track-active { stroke: var(--slider-active); }
    .track-inactive { stroke: var(--slider-inactive); }
    .slider-thumb { fill: var(--slider-thumb); }
    .slider-hit { fill: transparent; pointer-events: none; cursor: pointer; outline: none; }
    .slider-hit:focus-visible { stroke: var(--slider-thumb); stroke-width: 1; }


    /* Окно над островом: собирается из четырёх углов индикатора. Слайдер уходит при открытии. */
    .slider-svg { transition: opacity 120ms ease; }
    .island-menu {
      position: absolute; z-index: 6; left: 0; width: 100%;
      visibility: hidden; pointer-events: none;
    }
    .island.menu-live .island-menu { visibility: visible; pointer-events: none; }
    .island.menu-live .island-menu-body { pointer-events: auto; }
    .island-menu-body {
      position: absolute; left: 0; box-sizing: border-box; padding: 0 16px 4px;
      display: flex; flex-direction: column; gap: 6px; color: var(--ink); opacity: 0;
      overflow: hidden;
    }
    .island-menu-body > * { flex: none; }
    /* Полоска над окном меню: вне рамки меню. Тянем вверх — окно отделяется и растягивается */
    .menu-handle {
      transform-origin: 50% 100%;
      position: absolute; left: 0; right: 0; z-index: 4;
      height: var(--handle-zone, 26px);
      display: flex; align-items: center; justify-content: center;
      cursor: grab; touch-action: none; pointer-events: auto;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .menu-pill {
      display: block; flex: none; border-radius: 999px;
      background: var(--handle-color, #2563ff);
    }
    /* Отделённое окно: самостоятельный элемент, без выделения текста и синей подсветки */
    .island-menu.detached {
      position: fixed; z-index: 60; visibility: visible; pointer-events: none;
      background: none; box-shadow: none; overflow: visible;
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .island-menu.detached .island-menu-body {
      position: relative; left: auto; top: auto; width: 100%; height: 100%;
      opacity: 1; pointer-events: auto; overflow: hidden;
      padding-top: var(--menu-pad-top, 6px);
      background: var(--page); border-radius: 24px;
      box-shadow: 0 10px 34px rgba(0,0,0,.18);
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .island-menu.detached .island-menu-body * {
      -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent;
    }
    .island-menu.detached .menu-handle { top: calc(-1 * var(--handle-zone, 26px) - 6px); }
    .island-menu, .island-menu * { -webkit-touch-callout: none; }
    .island-menu ::selection { background: transparent; }
    .island-menu input, .island-menu .mp-export { -webkit-user-select: text; user-select: text; }
    /* Края отделённого окна: тянем, чтобы менять размер */
    .menu-edge { display: none; position: absolute; z-index: 5; touch-action: none; }
    .island-menu.detached .menu-edge { display: block; pointer-events: auto; }
    .menu-edge-r { top: 0; bottom: 0; right: -8px; width: 16px; cursor: ew-resize; }
    .menu-edge-b { left: 0; right: 0; bottom: -8px; height: 16px; cursor: ns-resize; }
    .menu-edge-c { right: -8px; bottom: -8px; width: 22px; height: 22px; cursor: nwse-resize; }
    /* Ползунки в попапе тянутся по горизонтали, не мешая прокрутке */
    .island-menu-body input[type="range"],
    .island-menu-body input[type="color"] { touch-action: none; }
    .island-menu-body h3 { margin: 0; font-size: 15px; font-weight: 650; }
    .island-menu-body p { margin: 0; font-size: 12px; line-height: 1.4; opacity: .8; }
    .island-menu-body button {
      align-self: flex-end; margin-top: auto; border: 0; border-radius: 999px;
      padding: 8px 14px; background: var(--ink); color: #fff; font: inherit; cursor: pointer;
    }
    .island.menu-open .slider-svg { opacity: 0; }
    .island.menu-open .slider-svg * { pointer-events: none !important; }

    /* ---------- Меню: вкладки и подвкладки ---------- */
    .island-menu-body .mp-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .island-menu-body .mp-head button { align-self: auto; margin: 0; padding: 6px 12px; font-size: 12px; }
    .island-menu-body > .mp-scroll {
      flex: 1 1 auto; min-height: 0; overflow-y: auto; overscroll-behavior: contain;
      touch-action: pan-y; padding: 2px 2px 4px 0;
    }
    .mp-tabs {
      position: relative; display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none;
      touch-action: pan-x; overscroll-behavior: contain;
    }
    .mp-tabs::-webkit-scrollbar { display: none; }
    .mp-tabs[hidden] { display: none; }
    .island-menu-body .mp-tab {
      position: relative; z-index: 1; flex: none; align-self: auto; margin: 0; border: 0; border-radius: var(--mt-pill-r);
      padding: var(--mt-pad-y) var(--mt-pad-x); background: transparent; color: var(--mt-text);
      font: inherit; font-size: var(--mt-fs); font-weight: 600;
      opacity: var(--mt-op); cursor: pointer; transition: opacity 160ms, color var(--mt-text-ms);
    }
    .island-menu-body .mp-tab:hover { opacity: var(--mt-op-hover); }
    .island-menu-body .mp-tab.is-active { color: var(--mt-pill-text); opacity: 1; }
    .island-menu-body .mp-sub .mp-tab {
      border-radius: 0; padding: var(--mt-sub-pad-y) var(--mt-sub-pad-x); font-size: var(--mt-sub-fs); font-weight: 500;
    }
    .island-menu-body .mp-sub .mp-tab.is-active { color: var(--mt-text); }
    .mp-tabs { gap: var(--mt-gap); }
    .mp-ind { position: absolute; left: 0; z-index: 0; pointer-events: none; will-change: transform, width; }
    .mp-ind.pill { top: 0; bottom: 0; background: var(--mt-pill); border-radius: var(--mt-pill-r); }
    .mp-ind.line { bottom: 0; height: var(--mt-line-h); background: var(--mt-line); border-radius: 999px; }
    .island-menu-body .mp-tab:focus-visible { outline: 2px solid var(--ink); outline-offset: 1px; }

    .mrow { display: grid; gap: 2px; padding: 5px 0; }
    .mrow-top { display: flex; justify-content: space-between; gap: 8px; font-size: 12px; }
    .mrow-top label, .mrow.inline label { opacity: .85; font-size: 12px; }
    .mrow-top output { opacity: .65; font-variant-numeric: tabular-nums; }
    .mrow.inline { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
    .mrow input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--ink); }
    .mrow input[type="color"] {
      width: 44px; height: 24px; padding: 0; border: 1px solid rgba(0,0,0,.25);
      border-radius: 6px; background: none; cursor: pointer;
    }
    .island-menu-body .mp-btn { align-self: auto; margin: 0 6px 0 0; padding: 8px 14px; font-size: 12px; }
    .mp-export {
      margin: 10px 0 0; padding: 8px; border-radius: 8px; background: rgba(0,0,0,.08);
      font-size: 10px; white-space: pre-wrap; word-break: break-all; max-height: 140px;
      overflow: auto; user-select: all; -webkit-user-select: all;
    }
    .mp-export[hidden] { display: none; }

    /* ---------- MD3-слайдер: активная часть, ручка, остаток с точкой на конце ---------- */
    @property --hw { syntax: '<length>'; inherits: true; initial-value: 4px; }
    .md-slider {
      --hw: var(--ms-handle-w);
      --f: 0;
      position: relative; width: 100%;
      height: max(var(--ms-h), var(--ms-handle-h), var(--ms-track-h));
      touch-action: pan-y; cursor: pointer; outline: none;
      -webkit-tap-highlight-color: transparent;
    }
    .ms-active, .ms-handle, .ms-inactive { position: absolute; top: 50%; transform: translateY(-50%); }
    .ms-active {
      left: 0; height: var(--ms-track-h); background: var(--ms-active);
      width: max(0px, calc((100% - var(--hw)) * var(--f) - var(--ms-gap)));
      border-radius: var(--ms-outer-r) var(--ms-inner-r) var(--ms-inner-r) var(--ms-outer-r);
    }
    .ms-handle {
      left: calc((100% - var(--hw)) * var(--f)); width: var(--hw); height: var(--ms-handle-h);
      background: var(--ms-handle); border-radius: var(--ms-handle-r);
    }
    .ms-inactive {
      left: calc((100% - var(--hw)) * var(--f) + var(--hw) + var(--ms-gap)); right: 0;
      height: var(--ms-track-h); background: var(--ms-inactive); overflow: hidden;
      border-radius: var(--ms-inner-r) var(--ms-outer-r) var(--ms-outer-r) var(--ms-inner-r);
    }
    .ms-dot {
      position: absolute; right: var(--ms-dot-inset); top: 50%; transform: translateY(-50%);
      width: var(--ms-dot-d); height: var(--ms-dot-d); border-radius: 50%; background: var(--ms-dot);
    }
    .ms-bubble {
      position: absolute; z-index: 2; pointer-events: none; opacity: 0;
      left: calc((100% - var(--hw)) * var(--f) + var(--hw) / 2);
      bottom: calc(50% + var(--ms-handle-h) / 2 + 4px); transform: translateX(-50%);
      padding: 3px 8px; border-radius: 999px; font-size: 11px; white-space: nowrap;
      background: var(--ms-bubble-bg); color: var(--ms-bubble-text);
      transition: opacity 120ms ease;
    }
    .md-slider.is-active .ms-bubble { opacity: var(--ms-bubble-on); }
    .md-slider:focus-visible .ms-handle { outline: 2px solid var(--ink); outline-offset: 2px; }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: .01ms !important; }
    }
  </style>
</head>
<body>
  <main class="demo">
    <div class="island-wrap">
      <nav class="island" id="island" aria-label="Основные вкладки">
        <svg class="island-shape" id="shape" viewBox="0 0 306 74" preserveAspectRatio="none" aria-hidden="true">
          <path id="shapePath" d=""/>
        </svg>
        <div class="indicator" id="indicator" aria-hidden="true"></div>
        <svg class="indicator-morph" id="morphSvg" viewBox="0 0 306 74" preserveAspectRatio="none" aria-hidden="true" style="display:none">
          <path id="morphPath" d=""/>
        </svg>
        <section class="island-menu" id="islandMenu" aria-hidden="true" aria-label="Меню главной вкладки">
          <div class="island-menu-body" id="menuBody">
            <div class="mp-head">
              <h3 id="menuTitle">Настройки</h3>
              <button type="button" id="menuClose">Закрыть</button>
            </div>
            <div class="mp-tabs" id="mpCats" role="tablist" aria-label="Разделы"></div>
            <div class="mp-tabs mp-sub" id="mpSubs" role="tablist" aria-label="Подразделы"></div>
            <div class="mp-scroll" id="mpScroll"></div>
          </div>
        </section>

        <button class="tab" type="button" data-tab="home" aria-label="Главная" aria-current="true">
          <span class="icon-frame">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3.3 14.1 15 4.4a1.65 1.65 0 0 1 2.1 0l11.6 9.7a1.4 1.4 0 0 1-1.8 2.1l-1.6-1.3v11a1.8 1.8 0 0 1-1.8 1.8H8.5a1.8 1.8 0 0 1-1.8-1.8v-11l-1.6 1.3a1.4 1.4 0 1 1-1.8-2.1Z"/></svg>
          </span>
        </button>

        <button class="tab" type="button" data-tab="discover" aria-label="Обзор">
          <span class="icon-frame">
            <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="15" cy="18" r="10.6" fill="currentColor"/><path d="M20.8 8.8 24 5.5" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"/><circle cx="25.2" cy="5" r="3.1" fill="currentColor"/><circle cx="25.2" cy="5" r="1" fill="var(--ink)" opacity=".62"/><path d="M9.4 12.9a7.3 7.3 0 0 1 6.1-2.9" stroke="#fff" stroke-opacity=".24" stroke-width="1.4" stroke-linecap="round" fill="none"/></svg>
          </span>
        </button>

        <button class="action" id="actionButton" type="button" aria-label="Создать">
          <span class="action-panel" id="actionPanel" aria-hidden="true"></span>
          <span class="action-frame" id="actionFrame" aria-hidden="true">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 5.2v21.6M5.2 16h21.6" fill="none" stroke="currentColor" stroke-width="3.4" stroke-linecap="square"/></svg>
          </span>
        </button>

        <button class="tab" type="button" data-tab="library" aria-label="Библиотека">
          <span class="icon-frame">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="currentColor" d="M3.8 8.7h9.7l2.2 2.5h12.5v14.5a2 2 0 0 1-2 2H3.8a2 2 0 0 1-2-2V10.7a2 2 0 0 1 2-2Z"/><path fill="currentColor" d="M10 4.3h11.8v5.2H10z"/></svg>
          </span>
        </button>

        <button class="tab" type="button" data-tab="profile" aria-label="Профиль">
          <span class="icon-frame">

        sliderLineH: 24,             // px, высота линии при перетаскивании
        sliderThumbGap: 4,           // px, зазор между кружком и дорожкой
        sliderHit: 22,               // px, высота зоны нажатия
        sliderMargin: 0,             // px, отступ дорожки от ушей
        waveAmp: 3,                  // px, амплитуда волны
        waveLen: 26,                 // px, длина волны
        waveSpeed: 26,               // px/s, скорость бега волны
        waveTaper: 14,               // px, сглаживание волны у краёв и у кружка
        waveSpring: { k: 180, z: 0.7 },       // пружина появления и пропадания волны
        squeezeSpring: { k: 300, z: 0.45 },   // пружина: кружок → линия
        thumbSpring: { k: 360, z: 0.6 },      // пружина движения кружка
        // Морф углов индикатора: клик по уже активной вкладке «домик» (крайней левой).

        pullSpring: { k: 420, z: 0.5 },    // пружина растяжения: z < 1 даёт отскок при возврате
        menuH: 400,                        // px, высота окна над островом
        menuGap: 8,                        // px, зазор между островом и окном
        menuPadTop: 18,                    // px, отступ содержимого окна от верхнего края
        menuMinH: 120,                     // px, минимальная высота окна при срезе сверху полоской
        menuCut: { k: 420, z: 0.6 },       // пружина среза высоты сверху: z < 1 — отскок
        // Полоска над окном меню и отделённое окно. Отдельные настройки, не связаны с вытягиванием острова.
        menuHandle: {
          color: '#2563ff',    // цвет полоски (яркий синий)
          zone: 26,            // px, высота зоны полоски над окном
          width: 44,           // px, длина полоски в покое

          height: 5,           // px, толщина полоски
          stretchPill: 1,      // во сколько раз полоска вытягивается вместе с окном (по высоте)
          openAt: 40,          // px, сколько вытянуть полоску, чтобы окно отделилось

          lift: 0.35,          // доля растяжения, на которую поднимается нижняя грань окна
          radius: 24,          // px, скругление отделённого окна в покое
          minW: 220, minH: 180, // px, минимальный размер окна при растягивании краёв
          k: 380, z: 0.5,      // пружина растяжения окна (z < 1 — отскок)
          moveK: 420, moveZ: 0.55,     // пружина перемещения окна по линии
          resizeK: 420, resizeZ: 0.6,  // пружина размера окна при растягивании краёв
          widthK: 600, widthZ: 0.6,    // пружина длины полоски

        },
        // Полоска над окном меню и отделение окна. Отдельные настройки, не связаны с вытягиванием острова.

          innerR: 2,           // px, внутреннее скругление (у ручки)
          handleW: 4,          // px, ширина ручки
          handleWActive: 2,    // px, ширина ручки при перетаскивании
          handleH: 28,         // px, высота ручки
          handleR: 2,          // px, скругление ручки
          dotOn: true,         // точка на конце остатка
          dotD: 4,             // px, диаметр точки
          dotInset: 6,         // px, отступ точки от правого края
          spring: true,        // пружинная анимация ручки и дорожки
          moveK: 360,          // упругость движения ручки
          moveZ: 0.55,         // гашение отскока движения (меньше — больше отскока)
          squeezeK: 300,       // упругость сужения ручки при нажатии
          squeezeZ: 0.45,      // гашение отскока сужения
          bubble: true,        // подсказка со значением при перетаскивании
          active: '#111216',   // цвет активной части
          handle: '#111216',   // цвет ручки
          inactive: '#111216', // цвет остатка
          inactiveA: 0.2,      // прозрачность остатка
          dot: '#111216',      // цвет точки

        },

        mt: {

          pillK: 420,          // упругость пилюли
          pillZ: 0.5,          // гашение отскока пилюли (меньше — больше отскока)
          lineK: 420,          // упругость линии
          lineZ: 0.5,          // гашение отскока линии
          pillStretch: false,  // растяжение пилюли при движении (выкл — едет цельной, с отскоком)
          lineStretch: false,  // растяжение линии при движении
          trail: 0.4,          // упругость заднего края (меньше — сильнее растяжение)
          trailZ: 0.5,         // гашение заднего края
          scrollSpring: true,  // пружинное пролистывание ряда вкладок
          scrollK: 220,        // упругость пролистывания

          pillColor: '#111216',
          pillText: '#ffffff', // текст на пилюле
          pillR: 20,           // px, скругление пилюли и вкладок
          lineColor: '#111216',
          lineH: 2,            // px, толщина линии
          lineInset: 0,        // px, отступ линии от краёв вкладки
          textColor: '#111216',
          opacity: 0.65,       // прозрачность неактивных вкладок
          opacityHover: 0.9,   // при наведении
          textMs: 160,         // мс, смена цвета текста
          fontSize: 12,        // px, разделы
          subFontSize: 12,     // px, подразделы
          padX: 12, padY: 6,   // px, отступы разделов
          subPadX: 8, subPadY: 5, // px, отступы подразделов
          gap: 4,              // px, зазор между вкладками
        },
        colors: {
          page: '#ffffff',
          ink: '#111216',
          yellow: '#d5c66f',
          green: '#c4e5b8',
          greenHover: '#d1ebc7',
          sliderActive: '#c4c6ae',
          sliderInactive: '#4a4a44',
          sliderThumb: '#b9bba3',
        },
      };

      const STORE_KEY = 'md3-spring-island:v9';
      const narrow = window.matchMedia('(max-width: 420px)').matches;
      const defaultsFor = () => {
        const d = JSON.parse(JSON.stringify(DEFAULTS));
        if (narrow) {
          d.iconSize = 28;
          d.islandHeight = 90;
          d.islandWidth = Math.min(410, window.innerWidth - 48);
        }
        return d;
      };

      // MANUAL — ручные значения (панель и экспорт). CFG — то, что читает движок, пересчитывается из MANUAL.
      const MANUAL = defaultsFor();

      // Сохранённые значения накладываем поверх дефолтов.
      function mergeInto(target, source) {
        for (const key of Object.keys(source)) {
          if (!(key in target)) continue;
          const a = target[key];
          const b = source[key];
          if (a && typeof a === 'object' && b && typeof b === 'object') mergeInto(a, b);
          else if (typeof b === typeof a) target[key] = b;
        }
      }
      try {
        const saved = JSON.parse(localStorage.getItem(STORE_KEY) || 'null');
        if (saved) mergeInto(MANUAL, saved);
      } catch (_) {}

      function save() {
        try { localStorage.setItem(STORE_KEY, JSON.stringify(MANUAL)); } catch (_) {}
      }

      // ---------- База: из MANUAL получаем CFG для движка ----------
      // Скорость: все пружины острова k × s², время (задержки, замах, закрытие) / s.
      // Отскок: ζ_итог = 1 − (1 − ζ) × bz. Отставание: правые углы по X смешиваются с левыми.
      // При нулевых настройках базы CFG совпадает с MANUAL.
      const SPEED_KEYS = ['bodyMove', 'bodyDrag', 'driftSpring', 'driftReleaseSpring',
                          'leadEdge', 'trailEdge', 'pressSpring', 'releaseSpring', 'pullSpring'];
      const MORPH_OPEN_ORDER = { tl: 0, tr: 1, bl: 2, br: 3 };   // порядок открытия углов
      const MORPH_CLOSE_ORDER = { bl: 0, br: 1, tl: 2, tr: 3 };  // порядок закрытия: снизу вверх
      let CFG = null;

      function rebuild() {
        const M = MANUAL, B = M.base;
        const s = Math.max(0.01, B.speed / 100);
        const bz = B.bounce / 100;
        const lag = B.lag / 100;
        const tune = p => ({ k: p.k * s * s, z: 1 - (1 - p.z) * bz });
        const mix = (a, b) => ({ k: a.k + (b.k - a.k) * lag, z: a.z + (b.z - a.z) * lag });

        const C = JSON.parse(JSON.stringify(M));
        SPEED_KEYS.forEach(key => { C[key] = tune(M[key]); });

        C.morph.tl.x = tune(M.morph.tl.x);
        C.morph.bl.x = tune(M.morph.bl.x);
        C.morph.tr.x = tune(mix(M.morph.tl.x, M.morph.tr.x));
        C.morph.br.x = tune(mix(M.morph.bl.x, M.morph.br.x));
        ['tl', 'tr', 'bl', 'br'].forEach(k => {
          C.morph[k].y = tune(M.morph[k].y);
          C.morph[k].delay = M.morph[k].delay / s;
          C.morph[k].preMs = M.morph[k].preMs / s;
        });
        Object.keys(MORPH_CLOSE_ORDER).forEach(k => { C.closeDelay[k] = M.closeDelay[k] / s; });
        CFG = C;
      }

      // Каскад и замах пишутся в поля углов: панель показывает то же, что база.
      function writeCascade() {
        const c = MANUAL.base.cascade;
        Object.keys(MORPH_OPEN_ORDER).forEach(k => { MANUAL.morph[k].delay = MORPH_OPEN_ORDER[k] * c; });
        Object.keys(MORPH_CLOSE_ORDER).forEach(k => { MANUAL.closeDelay[k] = MORPH_CLOSE_ORDER[k] * c; });
      }
      function writeLash() {
        MANUAL.morph.tr.preX = -MANUAL.base.lash;
        MANUAL.morph.br.preX = -MANUAL.base.lash;
      }

      rebuild();

      const sp = s => ({ k: s.k, c: 2 * s.z * Math.sqrt(s.k) });

      // ---------- DOM ----------
      const island = document.getElementById('island');
      const indicator = document.getElementById('indicator');
      const shapeEl = document.getElementById('shape');
      const shapePath = document.getElementById('shapePath');
      const tabs = [...island.querySelectorAll('.tab')];
      const actionButton = document.getElementById('actionButton');
      const actionPanel = document.getElementById('actionPanel');
      const actionFrame = document.getElementById('actionFrame');
      const actionGlyph = actionFrame.querySelector('svg');
      const trackActive = document.getElementById('trackActive');
      const trackInactive = document.getElementById('trackInactive');
      const sliderThumb = document.getElementById('sliderThumb');
      const sliderHit = document.getElementById('sliderHit');
      const sliderSvg = document.getElementById('sliderSvg');
      const morphSvg = document.getElementById('morphSvg');
      const morphPath = document.getElementById('morphPath');
      const islandMenu = document.getElementById('islandMenu');
      const menuBody = document.getElementById('menuBody');
      const menuClose = document.getElementById('menuClose');
      const menuTitle = document.getElementById('menuTitle');
      // Вытягивание индикатора вверх: растяжение верхней грани и отскок при возврате
      const pullStretch = d => CFG.pullMax * (1 - Math.exp(-d / CFG.pullMax));
      function stepPull(dt) {
        const s = sp(CFG.pullSpring);
        S.pullV += (s.k * (S.pullT - S.pullP) - s.c * S.pullV) * dt;
        S.pullP += S.pullV * dt;
      }
      let menuOpen = false;
      let menuDetached = false;   // окно настроек отделено от острова (остров в обычном виде)
      const morphTop = () => -(CFG.menuH + CFG.menuGap) - 60;    // верх холста морфа с запасом
      let indRad = { tl: 6, tr: 6, br: 6, bl: 6 };         // скругления индикатора в покое (обновляет paint)

      function toggleIslandMenu(force) {
        const opening = force ?? !menuOpen;
        if (opening && menuDetached) attachMenu();
        if (opening === menuOpen) return;
        menuOpen = opening;
        if (!opening) S.cutT = 0;
        island.classList.toggle('menu-open', opening);
        islandMenu.setAttribute('aria-hidden', String(!opening));
        if (opening) {
          menuClose.focus({ preventScroll: true });
        }
        if (reduced || !CFG.morph.on) {
          // Без анимации: сразу ставим углы в цель
          const r = morphRest();
          MORPH_KEYS.forEach(k => {
            const p = opening ? morphWinOf(k) : morphRestOf(k, r);
            Object.assign(S.mo.c[k], { x: p.x, y: p.y, vx: 0, vy: 0 });
            S.mo.c[k].t = 1e6;
            S.mo.c[k].opening = opening;
            S.mo.c[k].skipPre = false;
          });
          S.mo.on = opening;
          S.mo.opening = opening;
          S.cut = S.cutT; S.cutV = 0;
          paint();
          return;
        }
        startMorph(opening);
      }
      // ---------- Полоска над окном и отделённое окно ----------
      const menuHandle = document.createElement('div');
      menuHandle.className = 'menu-handle';
      menuHandle.setAttribute('role', 'presentation');
      const pill = document.createElement('i');
      pill.className = 'menu-pill';
      pill.setAttribute('aria-hidden', 'true');
      menuHandle.append(pill);
      islandMenu.prepend(menuHandle);
      const edgeEls = { r: 'menu-edge menu-edge-r', b: 'menu-edge menu-edge-b', c: 'menu-edge menu-edge-c' };
      const edgeDivs = Object.entries(edgeEls).map(([kind, cls]) => {
        const el = document.createElement('div');
        el.className = cls;
        el.setAttribute('aria-hidden', 'true');
        el.addEventListener('pointerdown', e => startResize(kind, e));
        islandMenu.append(el);
        return el;
      });

      // Пружины: x — текущее значение, t — цель, v — скорость. Каждая со своими настройками.
      const SPRING_KEYS = { st: ['k', 'z'], mx: ['moveK', 'moveZ'], sw: ['resizeK', 'resizeZ'],
                            sh: ['resizeK', 'resizeZ'], pw: ['widthK', 'widthZ'], cr: ['cornerK', 'cornerZ'] };
      const mkSpring = () => ({ x: 0, t: 0, v: 0 });
      const hd = { init: false, base: null, raf: 0, last: 0,
                   st: mkSpring(), mx: mkSpring(), sw: mkSpring(), sh: mkSpring(), pw: mkSpring(), cr: mkSpring() };
      let handleDrag = null, edgeDrag = null;

      function hdStep(dt) {
        const c = CFG.menuHandle;
        for (const key of Object.keys(SPRING_KEYS)) {
          const s = hd[key];
          const [kk, zz] = SPRING_KEYS[key];
          const k = c[kk], cc = 2 * c[zz] * Math.sqrt(k);
          s.v += (k * (s.t - s.x) - cc * s.v) * dt;
          s.x += s.v * dt;
        }
      }
      function hdSettled() {
        return Object.keys(SPRING_KEYS).every(key => {
          const s = hd[key];
          return Math.abs(s.t - s.x) < 0.05 && Math.abs(s.v) < 0.5;
        });
      }
      function hdSnap() {
        Object.keys(SPRING_KEYS).forEach(key => { const s = hd[key]; s.x = s.t; s.v = 0; });
        hdPaint();
      }
      function hdPaint() {
        const c = CFG.menuHandle;
        if (menuDetached && hd.base) {
          const b = hd.base;
          const w = Math.max(c.minW, b.w + hd.sw.x);
          const h = Math.max(c.minH, b.h + hd.sh.x + hd.st.x * (1 - c.lift));
          Object.assign(islandMenu.style, {
            left: (b.left + hd.mx.x).toFixed(2) + 'px',
            top: (b.top - hd.st.x).toFixed(2) + 'px',
            width: w.toFixed(2) + 'px',
            height: h.toFixed(2) + 'px',
          });
          menuBody.style.borderRadius = Math.max(0, hd.cr.x).toFixed(2) + 'px';
        }
        pill.style.width = Math.max(2, hd.pw.x).toFixed(2) + 'px';
        pill.style.height = Math.max(2, c.height + hd.st.x * c.stretchPill).toFixed(2) + 'px';
      }
      function hdTick(now) {
        hd.raf = 0;
        if (!hd.last) hd.last = now;
        const frame = Math.min((now - hd.last) / 1000, 1 / 30);
        hd.last = now;
        const n = Math.max(1, Math.ceil(frame * 240));
        const dt = frame / n;
        for (let i = 0; i < n; i++) hdStep(dt);
        hdPaint();
        if (hdSettled()) { hdSnap(); hd.last = 0; return; }
        hd.raf = requestAnimationFrame(hdTick);
      }
      function hdKick() {
        const c = CFG.menuHandle;
        if (!hd.init) { hd.init = true; hd.pw.x = hd.pw.t = c.width; }
        hd.pw.t = handleDrag ? c.widthActive : c.width;
        if (!c.spring || reduced) { hdSnap(); return; }
        if (!hd.raf) { hd.last = 0; hd.raf = requestAnimationFrame(hdTick); }
      }

      // Вернуть окно в остров (оно скрыто, пока меню не открыто).
      function attachMenu() {
        if (!menuDetached) return;
        menuDetached = false;
        handleDrag = null; edgeDrag = null;
        hd.base = null;
        ['st', 'mx', 'sw', 'sh'].forEach(key => { hd[key].x = hd[key].t = hd[key].v = 0; });
        island.insertBefore(islandMenu, island.querySelector('.tab'));
        islandMenu.classList.remove('detached');
        islandMenu.removeAttribute('style');
        menuBody.style.borderRadius = '';
        menuHandle.style.top = '';
        islandMenu.setAttribute('aria-hidden', 'true');
        hdKick();
      }

      // Отделить окно: оно становится самостоятельным элементом на том же месте.
      // Скругление начинается с текущего угла острова и пружиной переходит к окну.
      function detachMenu() {
        if (menuDetached || !menuOpen) return;
        const c = CFG.menuHandle;
        const r = islandMenu.getBoundingClientRect();
        const corners = MORPH_KEYS.map(k => (S.mo.r && S.mo.r[k] != null) ? S.mo.r[k] : indRad[k]);
        const r0 = corners.reduce((a, b) => a + b, 0) / corners.length;
        menuDetached = true;
        hd.base = { left: r.left, top: r.top, w: r.width, h: r.height };
        ['st', 'mx', 'sw', 'sh'].forEach(key => { hd[key].x = hd[key].t = hd[key].v = 0; });
        hd.cr.x = r0; hd.cr.t = c.radius; hd.cr.v = 0;
        document.body.appendChild(islandMenu);
        islandMenu.classList.add('detached');
        Object.assign(islandMenu.style, {
          left: r.left + 'px', top: r.top + 'px', width: r.width + 'px', height: r.height + 'px',
        });
        menuHandle.style.top = '';
        menuHandle.style.transform = '';
        menuHandle.style.opacity = '';
        Object.assign(menuBody.style, { top: '', height: '', width: '', paddingTop: '', opacity: '' });
        toggleIslandMenu(false);
        islandMenu.setAttribute('aria-hidden', 'false');
        hdKick();
      }

      // Полоска. Вверх — отделить и растянуть окно (после отделения — ещё и вверх растягивает).
      // Вниз — вернуть в остров. Вбок — перемещает отделённое окно. Отпустили — пружина.
      islandMenu.addEventListener('mousedown', e => {
        if (e.target.closest && e.target.closest('input, textarea, .mp-export')) return;
        e.preventDefault();
      });
      menuHandle.addEventListener('pointerdown', e => {
        if (e.button !== 0 || !e.isPrimary) return;
        e.stopPropagation();
        e.preventDefault();
        handleDrag = { id: e.pointerId, x0: e.clientX, y0: e.clientY, axis: null, base: 0, bx: hd.mx.t, cut0: S.cutT };
        hdKick();
      });
      window.addEventListener('pointermove', e => {
        if (!handleDrag || e.pointerId !== handleDrag.id) return;
        const c = CFG.menuHandle;
        const dx = e.clientX - handleDrag.x0;
        const up = handleDrag.y0 - e.clientY;
        if (!handleDrag.axis) {
          if (Math.hypot(dx, up) < 6) return;
          handleDrag.axis = menuDetached && Math.abs(dx) > Math.abs(up) ? 'x' : 'y';
        }
        if (handleDrag.axis === 'x') {
          const b = hd.base;
          const minX = -b.left, maxX = window.innerWidth - b.left - (b.w + hd.sw.t);
          hd.mx.t = clamp(handleDrag.bx + dx, minX, maxX);
          hdKick();
          return;
        }
        if (!menuDetached && menuOpen && up < c.openAt) {
          S.cutT = clamp(handleDrag.cut0 - up, 0, CFG.menuH - CFG.menuMinH);
          ensureRunning();
          hdKick();
          return;
        }
        if (!menuDetached) {
          if (up < c.openAt) { hdKick(); return; }
          detachMenu();
          handleDrag.base = up;   // дальше растягиваем от точки отделения
        }
        const d = up - handleDrag.base;
        if (d < 0 && -d >= c.openAt) { handleDrag = null; attachMenu(); return; }
        const m = c.max;
        hd.st.t = d > 0 ? m * (1 - Math.exp(-d / m)) : 0;
        hdKick();
      });
      const endHandle = e => {
        if (!handleDrag || e.pointerId !== handleDrag.id) return;
        handleDrag = null;
        if (menuDetached) { hd.st.t = 0; hd.cr.t = CFG.menuHandle.radius; }
        hdKick();
      };
      window.addEventListener('pointerup', endHandle);
      window.addEventListener('pointercancel', endHandle);

      // Края отделённого окна: тянем — меняем размер; пружина даёт отскок при отпускании.
      function startResize(kind, e) {
        if (e.button !== 0 || !e.isPrimary || !menuDetached) return;
        e.stopPropagation();
        e.preventDefault();
        edgeDrag = { id: e.pointerId, kind, x0: e.clientX, y0: e.clientY, sw: hd.sw.t, sh: hd.sh.t };
        hdKick();
      }
      window.addEventListener('pointermove', e => {
        if (!edgeDrag || e.pointerId !== edgeDrag.id || !hd.base) return;
        const c = CFG.menuHandle, b = hd.base;
        const dx = e.clientX - edgeDrag.x0, dy = e.clientY - edgeDrag.y0;
        const maxW = window.innerWidth - (b.left + hd.mx.t);
        const maxH = window.innerHeight - b.top;
        if (edgeDrag.kind !== 'b') hd.sw.t = clamp(edgeDrag.sw + dx, c.minW - b.w, maxW - b.w);
        if (edgeDrag.kind !== 'r') hd.sh.t = clamp(edgeDrag.sh + dy, c.minH - b.h, maxH - b.h);
        hdKick();
      });
      const endEdge = e => {
        if (!edgeDrag || e.pointerId !== edgeDrag.id) return;
        edgeDrag = null;
        hdKick();
      };
      window.addEventListener('pointerup', endEdge);
      window.addEventListener('pointercancel', endEdge);

      menuClose.addEventListener('click', () => {
        if (menuDetached) attachMenu();
        else toggleIslandMenu(false);
      });
      document.addEventListener('pointerdown', e => {
        if (menuOpen && !island.contains(e.target) && !islandMenu.contains(e.target)) toggleIslandMenu(false);
      });


      const motionQuery = window.matchMedia('(prefers-reduced-motion: reduce)');
      let reduced = motionQuery.matches;
      motionQuery.addEventListener('change', e => { reduced = e.matches; });

      // ---------- Состояние ----------
      const S = {
        cut: 0, cutT: 0, cutV: 0,   // срез высоты окна сверху: текущий, цель, скорость
        body: 0, bodyV: 0, bodyTarget: 0, pullP: 0, pullV: 0, pullT: 0,  // опорная позиция левого края тайла
        L: 0, R: 0, vL: 0, vR: 0,          // видимые края индикатора (в локальных координатах)
        panel: 0, tPanel: 0, vPanel: 0,
        plus: 0, tPlus: 0, vPlus: 0,
        plusHidden: false,
        p: 0, vp: 0, pTarget: 0,
        dx: 0, vdx: 0, dxTarget: 0,
        wv: 0, vwv: 0,                     // волна: вес появления (0 — ровно, 1 — волна)
        phase: 0,                          // фаза бегущей волны
        progress: CFG.sliderProgress, sq: 0, vsq: 0, // прогресс и сжатие кружка в линию
        thumb: 0, vthumb: 0,               // положение кружка от начала дорожки
        sDrag: false,                      // перетаскивание ползунка        // сдвиг всего острова по горизонтали           // морф нажатия: 0 — покой, 1 — прижато
        scale: 1,                          // текущий масштаб острова (нужен для координат указателя)
        mode: 'move',                      // 'move' — переход по кнопке, 'drag' — за пальцем
      };

      // Состояние морфа углов: четыре угла, у каждого позиция, скорость и флаг старта.
      const newCorner = () => ({ x: 0, y: 0, vx: 0, vy: 0, t: 0, opening: false, skipPre: false });
      S.mo = { on: false, opening: false, r: { tl: 6, tr: 6, br: 6, bl: 6 }, c: { tl: newCorner(), tr: newCorner(), br: newCorner(), bl: newCorner() } };

      let slots = [];                      // {x, w} для каждой вкладки
      let tabW = 0, minX = 0, maxX = 0;    // допустимый диапазон левого края тела
      let leftMid = 0, rightMid = 0;       // середины переходов для скругления углов
      let actionL = 0, actionR = 0;
      let indH = 0;                        // высота индикатора: предел скругления
      let indTop = 0;                      // верх индикатора в координатах острова (для морфа углов)
      let IW = 1, IH = 1;                  // размер острова без трансформаций
      let activeId = null;
      let drag = null;
      let justDragged = false;
      let pressPointer = null;
      let pressTimer = 0;
      let rafId = 0, lastT = 0;

      const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
      const lerp = (a, b, t) => a + (b - a) * t;
      const blendSpring = (a, b, t) => sp({ k: lerp(a.k, b.k, t), z: lerp(a.z, b.z, t) });

      // t = 1 — угол полностью круглый (radiusMax), t = 0 — почти прямой (radiusMin).
      const cornerRadius = t => {
        const s = clamp(t, 0, 1);
        return CFG.radiusMin + (CFG.radiusMax - CFG.radiusMin) * s * s * (3 - 2 * s);
      };

      // Полу-неявный Эйлер: сначала скорость, потом позиция.
      function step2(x, v, target, s, dt) {
        v += (s.k * (target - x) - s.c * v) * dt;
        return [x + v * dt, v];
      }

      // Мягкая стенка: вне диапазона сила возвращает обратно, внутри — ноль.
      function wallAccel(x, v, lo, hi) {
        const W = sp(CFG.wall);
        if (x < lo) return W.k * (lo - x) - W.c * v;
        if (x > hi) return W.k * (hi - x) - W.c * v;
        return 0;
      }

      // ---------- Силуэт острова ----------
      const smooth = t => t * t * (3 - 2 * t);

      // Дорожка ползунка лежит на плато острова, между ушами (отступ — sliderMargin).
      function sliderGeom() {
        const eW = CFG.earWidth / 100 * IW;
        const x0 = eW + CFG.sliderMargin;
        const x1 = IW - eW - CFG.sliderMargin;
        return { x0, x1, L: Math.max(1, x1 - x0) };
      }

      // Одна функция волны и для дорожки, и для верхней грани острова — поэтому они повторяют друг друга точь-в-точь.
      // Огибающая гасит волну у краёв дорожки и у кружка, чтобы не было ступенек.
      function waveAt(x, g, thumbX) {
        const amp = CFG.waveAmp * S.wv;
        if (amp === 0) return 0;
        const u = x - g.x0;
        const t = Math.max(1, CFG.waveTaper);
        const a = smooth(clamp(u / t, 0, 1));
        const b = smooth(clamp((thumbX - x) / t, 0, 1));
        return amp * a * b * Math.sin(2 * Math.PI * u / Math.max(1, CFG.waveLen) - S.phase);
      }

      // Верхняя грань острова: в покое — плато с волной ползунка, при прижатии — ровная плоскость с квадратными углами.
      function buildShape(p) {
        const W = IW, H = IH;
        const eW = CFG.earWidth / 100 * W;
        const eYi = CFG.earDepth / 100 * H;      // уровень плато в покое
        const eYp = CFG.planeY / 100 * H;        // уровень плоскости в прижатом виде
        const bX = CFG.bottomX / 100 * W;
        const bY = CFG.bottomY / 100 * H;
        const r = Math.max(0, Math.min(CFG.planeR, W / 2, H / 2));
        const kr = CFG.planeK * r;
        const e1x = CFG.earX1 * eW, e1y = CFG.earY1 * eYi;
        const e2x = CFG.earX2 * eW, e2y = CFG.earY2 * eYi;
        const mix = (a, b) => a + (b - a) * p;
        const pt = (x, y) => `${x.toFixed(2)} ${y.toFixed(2)}`;
        const g = sliderGeom();
        const thumbX = g.x0 + S.thumb;

        const xa = mix(eW, r);
        const xb = mix(W - eW, W - r);
        const span = xb - xa;
        const n = Math.max(2, Math.min(240, Math.ceil(span / 2)));
        const topAt = i => {
          const x = xa + span * i / n;
          const wave = CFG.sliderOn ? waveAt(x, g, thumbX) : 0;
          return [x, mix(eYi + wave, eYp)];
        };

        const A   = pt(0, mix(0, eYp + r));
        const P1L = pt(mix(e1x, 0), mix(e1y, eYp + r - kr));
        const P2L = pt(mix(e2x, r - kr), mix(e2y, eYp));
        const [sx, sy] = topAt(0);
        let d = `M${A} C${P1L} ${P2L} ${pt(sx, sy)}`;
        for (let i = 1; i <= n; i++) {
          const [x, y] = topAt(i);
          d += ` L${pt(x, y)}`;
        }
        const P1R = pt(mix(W - e2x, W - r + kr), mix(e2y, eYp));
        const P2R = pt(mix(W - e1x, W), mix(e1y, eYp + r - kr));
        const PR  = pt(W, mix(0, eYp + r));
        const Q1  = pt(W, H - bY);
        const C3  = pt(W, H - 0.46 * bY);
        const C4  = pt(W - 0.417 * bX, H);
        const Q2  = pt(W - bX, H);
        const Q3  = pt(bX, H);
        const C5  = pt(0.417 * bX, H);
        const C6  = pt(0, H - 0.46 * bY);
        const Q4  = pt(0, H - bY);
        return `${d} C${P1R} ${P2R} ${PR} L${Q1} C${C3} ${C4} ${Q2} L${Q3} C${C5} ${C6} ${Q4} Z`;
      }

      // ---------- Геометрия ----------
      // Координаты вкладок считаем без учёта масштаба острова: делим на текущий S.scale.
      function layout() {
        const ir = island.getBoundingClientRect();
        const s = S.scale || 1;
        slots = tabs.map(tab => {
          const r = tab.getBoundingClientRect();
          return { x: (r.left - ir.left) / s + CFG.inset, w: Math.max(1, r.width / s - CFG.inset * 2) };
        });
        tabW = slots[0].w;
        minX = slots[0].x;
        maxX = slots[slots.length - 1].x;
        const n = slots.length;
        leftMid = slots[0].x + (slots[1].x - slots[0].x) / 2;
        rightMid = (slots[n - 2].x + slots[n - 1].x) / 2 + tabW;
        actionL = actionButton.offsetLeft;
        actionR = actionL + actionButton.offsetWidth;
        IW = island.offsetWidth || 1;
        IH = island.offsetHeight || 1;
        const pTop = indicator.style.top, pH = indicator.style.height;
        indicator.style.top = ''; indicator.style.height = '';
        indH = indicator.offsetHeight || 0;
        indTop = indicator.offsetTop || 0;
        indicator.style.top = pTop; indicator.style.height = pH;
        morphSvg.setAttribute('viewBox', `0 0 ${IW} ${IH}`);
        shapeEl.setAttribute('viewBox', `0 0 ${IW} ${IH}`);
        sliderSvg.setAttribute('viewBox', `0 0 ${IW} ${IH}`);
      }

      function nearestIndex(left) {
        const center = left + tabW / 2;
        let best = 0;
        let bestDist = Infinity;
        slots.forEach((s, i) => {
          const d = Math.abs(center - (s.x + s.w / 2));
          if (d < bestDist) { bestDist = d; best = i; }
        });
        return best;
      }

      // ---------- Состояние вкладок ----------
      function setActive(index, force = false) {
        const id = tabs[index].dataset.tab;
        if (!force && id === activeId) return;
        activeId = id;
        tabs.forEach((tab, i) => {
          if (i === index) tab.setAttribute('aria-current', 'true');
          else tab.removeAttribute('aria-current');
        });
      }

      // ---------- Окклюзия плюса (с гистерезисом) ----------
      function updateOcclusion(instant = false) {
        const lo = Math.min(S.L, S.R);
        const hi = Math.max(S.L, S.R);
        if (!S.plusHidden && hi > actionL - CFG.occEnter && lo < actionR + CFG.occEnter) {
          S.plusHidden = true;
        } else if (S.plusHidden && (hi < actionL - CFG.occExit || lo > actionR + CFG.occExit)) {
          S.plusHidden = false;
        }
        S.tPanel = S.plusHidden ? CFG.panelHidden : 0;
        S.tPlus = S.plusHidden ? CFG.plusHidden : 0;
        actionButton.classList.toggle('is-hidden', S.plusHidden);
        actionButton.inert = S.plusHidden;
        if (instant || reduced) {
          S.panel = S.tPanel;
          S.plus = S.tPlus;
          S.vPanel = 0;
          S.vPlus = 0;
        }
      }

      // ---------- Морф углов индикатора ----------
      // Углы по контуру: верх-лево, верх-право, низ-право, низ-лево. Порядок старта задаёт delay.
      const MORPH_KEYS = ['tl', 'tr', 'br', 'bl'];
      const morphIsTop = k => k === 'tl' || k === 'tr';
      const morphIsRight = k => k === 'tr' || k === 'br';

      // Покой: текущие края индикатора и его верх/низ в координатах острова.
      function morphRest() {
        return {
          lo: Math.min(S.L, S.R),
          hi: Math.max(S.L, S.R),
          top: indTop - S.pullP,
          bot: indTop + indH - S.pullP * CFG.pullLift,
        };
      }
      function morphRestOf(k, r) {
        return { x: morphIsRight(k) ? r.hi : r.lo, y: morphIsTop(k) ? r.top : r.bot };
      }
      // Окно над островом: углы индикатора собираются в него по очереди, с отходом и пружинами.
      // Каждый угол ведёт свой отсчёт (c.t). При развороте на полпути угол продолжает с текущей точки.
      function morphWinOf(k) {
        const bottom = -CFG.menuGap, top = bottom - CFG.menuH + S.cut;
        return { x: morphIsRight(k) ? IW : 0, y: morphIsTop(k) ? top : bottom };
      }
      // Радиус угла окна — как у верхних ушей и нижних углов острова.
      const morphWinR = k => (morphIsTop(k) ? CFG.earWidth / 100 * IW : CFG.bottomX / 100 * IW);
      // Порядок возврата: нижний левый первым, верхний правый последним.

      // Цель угла: ждёт очереди на месте, затем отход (от начальной точки), затем конечная точка.
      function morphGoal(k, c) {
        const cfg = CFG.morph[k];
        const local = c.t - (c.opening ? cfg.delay : CFG.closeDelay[k]);
        if (local < 0) return { x: c.x, y: c.y };
        const start = c.opening ? morphRestOf(k, morphRest()) : morphWinOf(k);
        if (local < cfg.preMs && !c.skipPre) return { x: start.x + cfg.preX, y: start.y + cfg.preY };
        return c.opening ? morphWinOf(k) : morphRestOf(k, morphRest());
      }

      function startMorph(opening) {
        const r = morphRest();
        MORPH_KEYS.forEach(k => {
          const c = S.mo.c[k];
          const start = opening ? morphRestOf(k, r) : morphWinOf(k);
          if (!S.mo.on) Object.assign(c, { x: start.x, y: start.y, vx: 0, vy: 0 });
          // Если угол уже в пути, отход пропускаем: иначе он дёрнется назад к началу
          c.skipPre = Math.hypot(c.x - start.x, c.y - start.y) > 2;
          c.t = 0;
          c.opening = opening;
        });
        S.mo.opening = opening;
        S.mo.on = true;
        ensureRunning();
      }

      // Все углы дошли до цели: окно — до окна, закрытие — до покоя.
      function morphIdle() {
        if (!S.mo.on) return true;
        const r = morphRest();
        return MORPH_KEYS.every(k => {
          const cfg = CFG.morph[k];
          const c = S.mo.c[k];
          if (c.t < (c.opening ? cfg.delay : CFG.closeDelay[k]) + cfg.preMs) return false;
          const p = c.opening ? morphWinOf(k) : morphRestOf(k, r);
          return Math.abs(c.x - p.x) < 0.3 && Math.abs(c.y - p.y) < 0.3 &&
                 Math.abs(c.vx) < 2 && Math.abs(c.vy) < 2;
        });
      }

      function stepMorph(dt) {
        if (!S.mo.on) return;
        const m = CFG.morph;
        MORPH_KEYS.forEach(k => {
          const c = S.mo.c[k];
          c.t += dt * 1000;
          const tgt = morphGoal(k, c);
          const sx = sp(m[k].x), sy = sp(m[k].y);
          c.vx += (sx.k * (tgt.x - c.x) - sx.c * c.vx) * dt;
          c.x += c.vx * dt;
          c.vy += (sy.k * (tgt.y - c.y) - sy.c * c.vy) * dt;
          c.y += c.vy * dt;
        });
        const cs = sp(CFG.menuCut);
        S.cutV += (cs.k * (S.cutT - S.cut) - cs.c * S.cutV) * dt;
        S.cut += S.cutV * dt;
        if (!S.mo.opening && morphIdle()) S.mo.on = false;
      }

      // Фигура из четырёх углов: прямые рёбра и скругление каждого угла с его радиусом.
      function morphPathD() {
        const pts = MORPH_KEYS.map(k => ({ x: S.mo.c[k].x, y: S.mo.c[k].y }));
        const n = pts.length;
        const corners = [];
        for (let i = 0; i < n; i++) {
          const P = pts[i];
          const A = pts[(i + n - 1) % n];
          const B = pts[(i + 1) % n];
          const la = Math.max(1e-6, Math.hypot(A.x - P.x, A.y - P.y));
          const lb = Math.max(1e-6, Math.hypot(B.x - P.x, B.y - P.y));
          const r = Math.min(Math.max(0, S.mo.r[MORPH_KEYS[i]]), la / 2, lb / 2);
          corners.push({
            P,
            a: { x: P.x + (A.x - P.x) / la * r, y: P.y + (A.y - P.y) / la * r },
            b: { x: P.x + (B.x - P.x) / lb * r, y: P.y + (B.y - P.y) / lb * r },
          });
        }
        const f = p => `${p.x.toFixed(2)} ${p.y.toFixed(2)}`;
        let d = `M${f(corners[n - 1].b)}`;
        corners.forEach(c => { d += ` L${f(c.a)} Q${f(c.P)} ${f(c.b)}`; });
        return d + ' Z';
      }

      // ---------- Физика ----------
      function stepBody(dt) {
        const s = sp(S.mode === 'drag' ? CFG.bodyDrag : CFG.bodyMove);
        const a = s.k * (S.bodyTarget - S.body) - s.c * S.bodyV +
                  wallAccel(S.body, S.bodyV, minX, maxX);
        S.bodyV = clamp(S.bodyV + a * dt, -CFG.maxSpeed, CFG.maxSpeed);
        S.body += S.bodyV * dt;
      }

      function stepEdges(dt) {
        if (!CFG.stretchOn) {
          // Без растяжения: края жёстко следуют за телом, отскок даёт пружина тела.
          S.L = S.body; S.R = S.body + tabW;
          S.vL = S.vR = S.bodyV;
          return;
        }
        // Вес направления плавно меняется от скорости тела: роли краёв переключаются
        // постепенно, без скачков жёсткости на развороте.
        const wRight = 0.5 + 0.5 * clamp(S.bodyV / Math.max(1, CFG.dirThreshold), -1, 1);
        // Вправо: левый край — хвост (мягче), правый — ведущий (жёстче). Влево — наоборот.
        const sl = blendSpring(CFG.leadEdge, CFG.trailEdge, wRight);
        const sr = blendSpring(CFG.trailEdge, CFG.leadEdge, wRight);

        let aL = sl.k * (S.body - S.L) - sl.c * S.vL + wallAccel(S.L, S.vL, minX, Infinity);
        let aR = sr.k * (S.body + tabW - S.R) - sr.c * S.vR +
                 wallAccel(S.R, S.vR, -Infinity, maxX + tabW);

        // Ограничитель ширины: мягко держит растяжение и не даёт краям перевернуться.
        const w = S.R - S.L;
        const maxW = tabW + CFG.maxStretch;
        if (w > maxW || w < CFG.minWidth) {
          const limit = w > maxW ? maxW : CFG.minWidth;
          const T = sp(CFG.tether);
          const f = T.k * (w - limit) + T.c * (S.vR - S.vL);
          aL += f;
          aR -= f;
        }

        S.vL += aL * dt;
        S.L += S.vL * dt;
        S.vR += aR * dt;
        S.R += S.vR * dt;
      }

      // Морф нажатия: одна пружина на всё (остров, плоскость, индикатор), отскок регулируется ζ.
      function stepPress(dt) {
        const s = sp(S.pTarget > S.p ? CFG.pressSpring : CFG.releaseSpring);
        S.vp += (s.k * (S.pTarget - S.p) - s.c * S.vp) * dt;
        S.p += S.vp * dt;
      }

      // Цель сдвига: смещение индикатора от центра острова и его скорость. Только во время перетаскивания.
      function driftTarget() {
        if (!drag || !drag.moved) return 0;
        const center = (S.L + S.R) / 2;
        const pos = CFG.driftRatio * (center - IW / 2);
        const vel = CFG.driftVelocity * S.bodyV;
        return clamp(pos + vel, -CFG.driftMax, CFG.driftMax);
      }

      function stepDrift(dt) {
        S.dxTarget = driftTarget();
        const s = sp(drag && drag.moved ? CFG.driftSpring : CFG.driftReleaseSpring);
        S.vdx += (s.k * (S.dxTarget - S.dx) - s.c * S.vdx) * dt;
        S.dx += S.vdx * dt;
      }

      // ---------- Ползунок: физика ----------
      function stepSlider(dt) {
        const playingNow = CFG.sliderOn && CFG.sliderPlaying && !S.sDrag && !reduced && !menuOpen;
        if (playingNow) {
          // Воспроизведение: прогресс идёт, волна бежит по дорожке
          S.progress = (S.progress + CFG.sliderRate / 100 * dt) % 1;
          S.phase = (S.phase + 2 * Math.PI * CFG.waveSpeed / Math.max(1, CFG.waveLen) * dt) % (2 * Math.PI);
        }
        // Волна появляется при воспроизведении и становится плоской при паузе или перетаскивании
        const sw = sp(CFG.waveSpring);
        S.vwv += (sw.k * ((playingNow ? 1 : 0) - S.wv) - sw.c * S.vwv) * dt;
        S.wv += S.vwv * dt;
        // Кружок превращается в линию при перетаскивании
        const sq = sp(CFG.squeezeSpring);
        S.vsq += (sq.k * ((S.sDrag ? 1 : 0) - S.sq) - sq.c * S.vsq) * dt;
        S.sq += S.vsq * dt;
        // Кружок догоняет прогресс пружиной
        const th = sp(CFG.thumbSpring);
        const target = clamp(S.progress, 0, 1) * sliderGeom().L;
        S.vthumb += (th.k * (target - S.thumb) - th.c * S.vthumb) * dt;
        S.thumb += S.vthumb * dt;
      }

      function stepDecor(dt) {
        [S.panel, S.vPanel] = step2(S.panel, S.vPanel, S.tPanel, sp(CFG.panelSpring), dt);
        [S.plus, S.vPlus] = step2(S.plus, S.vPlus, S.tPlus, sp(CFG.plusSpring), dt);
      }

      function isSettled() {
        const near = (a, b) => Math.abs(a - b) < CFG.settlePos;
        const still = v => Math.abs(v) < CFG.settleVel;
        const unit = (a, b) => Math.abs(a - b) < CFG.pressSettle;
        const unitStill = v => Math.abs(v) < CFG.pressSettle * 10;
        const playingNow = CFG.sliderOn && CFG.sliderPlaying && !S.sDrag && !reduced && !menuOpen;
        const g = sliderGeom();
        return near(S.body, S.bodyTarget) && still(S.bodyV) &&
          near(S.L, S.body) && near(S.R, S.body + tabW) && still(S.vL) && still(S.vR) &&
          near(S.panel, S.tPanel) && still(S.vPanel) &&
          near(S.plus, S.tPlus) && still(S.vPlus) &&
          unit(S.pTarget, S.p) && unitStill(S.vp) &&
          near(S.dx, S.dxTarget) && still(S.vdx) &&
          morphIdle() && Math.abs(S.cutT - S.cut) < 0.05 && Math.abs(S.cutV) < 0.5 && Math.abs(S.pullP - S.pullT) < 0.05 && Math.abs(S.pullV) < 0.5 && !playingNow && unit(S.wv, 0) && unitStill(S.vwv) &&
          unit(S.sq, S.sDrag ? 1 : 0) && unitStill(S.vsq) &&
          near(S.thumb, clamp(S.progress, 0, 1) * g.L) && still(S.vthumb);
      }

      // ---------- Ползунок: отрисовка ----------
      // Дорожка и кружок лежат на линии base; верхняя грань острова — та же волна, но ниже на sliderGap.
      function paintSlider() {
        const v = CFG.sliderOn ? Math.max(0, 1 - S.p) : 0;   // присутствие: прячется при прижатии
        const g = sliderGeom();
        const base = CFG.earDepth / 100 * IH - (CFG.sliderGap + CFG.sliderTrackH / 2);
        const thumbX = g.x0 + S.thumb;
        const yAt = x => base + waveAt(x, g, thumbX);
        const tw = Math.max(1, lerp(CFG.sliderThumbD, CFG.sliderLineW, S.sq)) * v;
        const th = Math.max(1, lerp(CFG.sliderThumbD, CFG.sliderLineH, S.sq)) * v;
        const trackW = CFG.sliderTrackH * v;
        const half = tw / 2 + CFG.sliderThumbGap;

        // Активная часть — волна от начала дорожки до кружка
        let dA = '';
        const aEnd = thumbX - half;
        if (v > 0 && aEnd > g.x0) {
          const n = Math.max(1, Math.ceil((aEnd - g.x0) / 2));
          for (let i = 0; i <= n; i++) {
            const x = g.x0 + (aEnd - g.x0) * i / n;
            dA += `${i ? 'L' : 'M'}${x.toFixed(2)} ${yAt(x).toFixed(2)} `;
          }
        }
        // Неактивная часть — ровная линия справа от кружка
        const iStart = thumbX + half;
        const dI = v > 0 && g.x1 > iStart
          ? `M${iStart.toFixed(2)} ${base.toFixed(2)} L${g.x1.toFixed(2)} ${base.toFixed(2)}`
          : '';
        trackActive.setAttribute('d', dA);
        trackInactive.setAttribute('d', dI);
        trackActive.setAttribute('stroke-width', trackW.toFixed(2));
        trackInactive.setAttribute('stroke-width', trackW.toFixed(2));

        // Кружок (или линия при перетаскивании)
        const ty = yAt(thumbX);
        sliderThumb.setAttribute('x', (thumbX - tw / 2).toFixed(2));
        sliderThumb.setAttribute('y', (ty - th / 2).toFixed(2));
        sliderThumb.setAttribute('width', tw.toFixed(2));
        sliderThumb.setAttribute('height', th.toFixed(2));
        sliderThumb.setAttribute('rx', (Math.min(tw, th) / 2).toFixed(2));

        // Зона нажатия
        sliderHit.setAttribute('x', (g.x0 - 8).toFixed(2));
        sliderHit.setAttribute('y', (base - CFG.sliderHit / 2).toFixed(2));
        sliderHit.setAttribute('width', (g.L + 16).toFixed(2));
        sliderHit.setAttribute('height', CFG.sliderHit.toFixed(2));
        sliderHit.setAttribute('aria-valuenow', String(Math.round(clamp(S.progress, 0, 1) * 100)));
        sliderHit.style.pointerEvents = v > 0.5 ? 'all' : 'none';
      }

      function paint() {
        // Масштаб и подъём острова зависят от морфа.
        S.scale = 1 + (CFG.islandScale - 1) * S.p;
        const lift = CFG.islandLift * S.p;
        island.style.transform =
          `translate3d(${S.dx.toFixed(2)}px, ${(-lift).toFixed(2)}px, 0) scale(${S.scale.toFixed(4)})`;
        shapePath.setAttribute('d', buildShape(S.p));

        const lo = Math.min(S.L, S.R);
        const hi = Math.max(S.L, S.R);
        indicator.style.transform = `translate3d(${lo.toFixed(2)}px, 0, 0)`;
        indicator.style.width = `${Math.max(2, hi - lo).toFixed(2)}px`;
        indicator.style.top = `${(indTop - S.pullP).toFixed(2)}px`;
        indicator.style.height = `${Math.max(2, indH + S.pullP * (1 - CFG.pullLift)).toFixed(2)}px`;

        // Скругления зависят от положения: у края плавно меняются, когда край проходит середину перехода.
        const cap = indH > 0 ? indH / 2 : Infinity;
        const tL = clamp((leftMid + CFG.radiusRamp / 2 - lo) / CFG.radiusRamp, 0, 1);
        const tR = clamp((hi - (rightMid - CFG.radiusRamp / 2)) / CFG.radiusRamp, 0, 1);
        const lr = Math.min(cap, cornerRadius(tL));
        const rr = Math.min(cap, cornerRadius(tR));
        // У края верхний угол индикатора при нажатии становится как у плоскости.
        const top = Math.min(cap, CFG.indicatorSync ? CFG.planeR : CFG.indTopR);
        // Вес «у края»: 1 — тайл на крайней вкладке, 0 — тайл у середины перехода.
        const endL = clamp((leftMid - lo) / Math.max(1, leftMid - minX), 0, 1);
        const endR = clamp((hi - rightMid) / Math.max(1, maxX + tabW - rightMid), 0, 1);
        const pw = clamp(S.p, 0, 1);
        const tlr = lr + (top - lr) * pw * endL;
        const trr = rr + (top - rr) * pw * endR;
        indicator.style.borderRadius =
          `${tlr.toFixed(2)}px ${trr.toFixed(2)}px ${rr.toFixed(2)}px ${lr.toFixed(2)}px`;

        indRad = { tl: tlr, tr: trr, br: rr, bl: lr };
        // Морф углов: пока он идёт или окно открыто, индикатор скрыт, вместо него рисуется фигура из четырёх углов.
        indicator.style.opacity = S.mo.on ? '0' : '';
        morphSvg.style.display = S.mo.on ? 'block' : 'none';
        if (S.mo.on) {
          // Скругления: от скруглений индикатора к скруглениям окна, по пути каждого угла
          const rest = morphRest();
          let prSum = 0;
          MORPH_KEYS.forEach(k => {
            const rp = morphRestOf(k, rest), wp = morphWinOf(k), c = S.mo.c[k];
            const span = Math.hypot(wp.x - rp.x, wp.y - rp.y) || 1;
            const pr = clamp(Math.hypot(c.x - rp.x, c.y - rp.y) / span, 0, 1);
            prSum += pr;
            S.mo.r[k] = lerp(indRad[k], morphWinR(k), pr);
          });
          morphPath.setAttribute('d', morphPathD());
          const vy = morphTop();
          morphSvg.style.top = `${vy}px`;
          morphSvg.style.height = `${IH - vy}px`;
          morphSvg.setAttribute('viewBox', `0 ${vy} ${IW} ${IH - vy}`);
          if (!menuDetached) {
            islandMenu.style.top = `${vy}px`;
            islandMenu.style.height = `${IH - vy}px`;
            menuBody.style.top = `${-CFG.menuGap - CFG.menuH - vy + S.cut}px`;
            menuBody.style.height = `${CFG.menuH - S.cut}px`;
            menuBody.style.width = `${IW}px`;
            menuBody.style.paddingTop = `${CFG.menuPadTop}px`;
          const mh = islandMenu.querySelector('.menu-handle');
          if (mh) {
            mh.style.top = `${(-CFG.menuGap - CFG.menuH - vy - CFG.menuHandle.zone).toFixed(2)}px`;
            mh.style.height = `${CFG.menuHandle.zone}px`;
            // Полоска едет по верхней грани окна: центр — середина верхнего ребра, наклон — как у ребра
            const tl = S.mo.c.tl, tr = S.mo.c.tr;
            const mx = (tl.x + tr.x) / 2, my = (tl.y + tr.y) / 2;
            const ang = Math.atan2(tr.y - tl.y, tr.x - tl.x) * 180 / Math.PI;
            mh.style.transform = `translate(${(mx - IW / 2).toFixed(2)}px, ${(my + CFG.menuGap + CFG.menuH).toFixed(2)}px) rotate(${ang.toFixed(3)}deg)`;
            // Появляется из прозрачности, как только верхние углы начинают движение
            const wyNat = -CFG.menuGap - CFG.menuH;
            const rest0 = morphRest();
            const topPr = ['tl', 'tr'].map(k => {
              const rp = morphRestOf(k, rest0), c = S.mo.c[k];
              const span = Math.hypot((morphIsRight(k) ? IW : 0) - rp.x, wyNat - rp.y) || 1;
              return clamp(Math.hypot(c.x - rp.x, c.y - rp.y) / span, 0, 1);
            });
            mh.style.opacity = clamp((topPr[0] + topPr[1]) / 2 / 0.25, 0, 1).toFixed(3);
          }
            menuBody.style.opacity = clamp((prSum / MORPH_KEYS.length - 0.6) / 0.4, 0, 1).toFixed(3);
          }
        } else {
          morphSvg.style.top = '';
          morphSvg.style.height = '';
          morphSvg.setAttribute('viewBox', `0 0 ${IW} ${IH}`);
        }
        island.classList.toggle('menu-live', S.mo.on);

        actionPanel.style.transform = `translateY(${S.panel}%)`;
        actionFrame.style.transform = `translateY(${S.plus}%)`;
        paintSlider();
      }

      function tick(now) {
        rafId = 0;
        if (!lastT) lastT = now;
        const elapsed = Math.min((now - lastT) / 1000, 1 / 30);
        lastT = now;
        const steps = Math.max(1, Math.ceil(elapsed * CFG.substeps));
        const dt = elapsed / steps;
        for (let i = 0; i < steps; i++) {
          stepBody(dt);
          stepEdges(dt);
          stepPress(dt);
          stepDrift(dt);
          stepSlider(dt);
          stepDecor(dt);
          stepMorph(dt);
          stepPull(dt);
        }
        updateOcclusion();
        paint();
        if (isSettled()) {
          lastT = 0;
          return;
        }
        rafId = requestAnimationFrame(tick);
      }

      function ensureRunning() {
        if (rafId) return;
        lastT = 0;
        rafId = requestAnimationFrame(tick);
      }

      // Мгновенная установка (resize, reduced-motion, изменение геометрии).
      function placeAt(x) {
        if (!(drag && drag.moved)) { S.dx = 0; S.vdx = 0; }
        S.mode = 'move';
        S.body = S.bodyTarget = x;
        S.bodyV = 0;
        S.L = x;
        S.R = x + tabW;
        S.vL = 0;
        S.vR = 0;
        updateOcclusion(true);
        paint();
      }

      function selectTab(index) {
        setActive(index);
        S.mode = 'move';
        S.bodyTarget = slots[index].x;
        if (reduced) {
          placeAt(slots[index].x);
          return;
        }
        ensureRunning();
      }

      // ---------- Нажатие: морф острова ----------
      function setPressed(on) {
        S.pTarget = on ? 1 : 0;
        if (reduced) {
          S.p = S.pTarget;
          S.vp = 0;
          paint();
          return;
        }
        ensureRunning();
      }

      function beginPress(e) {
        if (CFG.pressOnlyIndicator && !pointInTile(e.clientX, e.clientY)) return;
        pressPointer = e.pointerId;
        clearTimeout(pressTimer);
        if (CFG.pressDelay > 0) pressTimer = setTimeout(() => setPressed(true), CFG.pressDelay);
        else setPressed(true);
      }

      function endPress(e) {
        if (pressPointer === null || e.pointerId !== pressPointer) return;
        pressPointer = null;
        clearTimeout(pressTimer);
        setPressed(false);
      }

      // ---------- Указатель ----------
      const pointInTile = (x, y) => {
        const r = indicator.getBoundingClientRect();
        const pad = CFG.hitPad;
        return x >= r.left - pad && x <= r.right + pad && y >= r.top - pad && y <= r.bottom + pad;
      };
      // Переводим экранные координаты в локальные острова: учитываем текущий масштаб.
      const localX = x => (x - island.getBoundingClientRect().left + S.dx) / S.scale;

      island.addEventListener('pointerdown', e => {
        justDragged = false;
        if (e.button !== 0 || !e.isPrimary) return;
        if (menuOpen) return;
        beginPress(e);
        if (actionButton.contains(e.target)) return;
        if (!pointInTile(e.clientX, e.clientY)) return;
        e.preventDefault();
        drag = {
          id: e.pointerId,
          // Захват считаем от видимого левого края, а не от тела: иначе тайл прыгает на первом движении.
          grab: localX(e.clientX) - Math.min(S.L, S.R),
          x0: e.clientX,
          y0: e.clientY,
          moved: false,
        };
        island.classList.add('is-dragging');
      });

      window.addEventListener('pointermove', e => {
        if (!drag || e.pointerId !== drag.id) return;
        if (!drag.moved) {
          if (Math.hypot(e.clientX - drag.x0, e.clientY - drag.y0) < CFG.dragThreshold) return;
          drag.moved = true;
          // Тянем вверх заметно сильнее, чем в сторону: это растяжение, а не перетаскивание
          drag.pull = (drag.y0 - e.clientY) > Math.abs(e.clientX - drag.x0) * CFG.pullBias;
          if (!drag.pull) {
            S.mode = 'drag';
            try { island.setPointerCapture(e.pointerId); } catch (_) {}
          }
        }
        e.preventDefault();

        if (drag.pull) {
          const up = Math.max(0, drag.y0 - e.clientY);
          if (!drag.opened && up >= CFG.pullOpen) {
            drag.opened = true;
            S.pullT = 0;
            if (!menuOpen) toggleIslandMenu(true);
          } else if (!drag.opened) {
            S.pullT = pullStretch(up);
          }
          ensureRunning();
          return;
        }

        const target = clamp(localX(e.clientX) - drag.grab, minX, maxX);
        S.bodyTarget = target;
        setActive(nearestIndex(target));

        if (reduced) {
          placeAt(target);
          S.dx = driftTarget();
          paint();
          return;
        }
        ensureRunning();
      }, { passive: false });

      function endDrag(e) {
        if (!drag || e.pointerId !== drag.id) return;
        const moved = drag.moved, pull = drag.pull;
        drag = null;
        island.classList.remove('is-dragging');
        try { island.releasePointerCapture(e.pointerId); } catch (_) {}
        if (!moved) return;
        justDragged = true;
        if (pull) {
          S.pullT = 0;          // отпустили: индикатор возвращается на место с отскоком
          ensureRunning();
          return;
        }
        selectTab(nearestIndex(S.bodyTarget));
      }
      window.addEventListener('pointerup', e => { endDrag(e); endPress(e); });
      window.addEventListener('pointercancel', e => { endDrag(e); endPress(e); });

      // ---------- Ползунок: перетаскивание и клавиатура ----------
      let sliderDrag = null;
      const progressFromX = x => {
        const g = sliderGeom();
        S.progress = clamp((x - g.x0) / g.L, 0, 1);
      };
      sliderHit.addEventListener('pointerdown', e => {
        if (e.button !== 0 || !e.isPrimary) return;
        e.stopPropagation();          // не запускать морф острова и перетаскивание тайла
        e.preventDefault();
        sliderDrag = { id: e.pointerId };
        S.sDrag = true;
        try { sliderHit.setPointerCapture(e.pointerId); } catch (_) {}
        progressFromX(localX(e.clientX));
        ensureRunning();
      });
      window.addEventListener('pointermove', e => {
        if (!sliderDrag || e.pointerId !== sliderDrag.id) return;
        progressFromX(localX(e.clientX));
        ensureRunning();
      });
      const endSliderDrag = e => {
        if (!sliderDrag || e.pointerId !== sliderDrag.id) return;
        sliderDrag = null;
        S.sDrag = false;
        ensureRunning();
      };
      window.addEventListener('pointerup', endSliderDrag);
      window.addEventListener('pointercancel', endSliderDrag);
      sliderHit.addEventListener('keydown', e => {
        const step = { ArrowLeft: -0.01, ArrowDown: -0.01, ArrowRight: 0.01, ArrowUp: 0.01 }[e.key];
        if (step !== undefined) S.progress = clamp(S.progress + step, 0, 1);
        else if (e.key === 'Home') S.progress = 0;
        else if (e.key === 'End') S.progress = 1;
        else return;
        e.preventDefault();
        ensureRunning();
      });

      island.addEventListener('pointermove', e => {
        if (drag || e.pointerType !== 'mouse') return;
        island.classList.toggle('is-grabbable', pointInTile(e.clientX, e.clientY));
      });
      island.addEventListener('pointerleave', () => island.classList.remove('is-grabbable'));

      // Click после перетаскивания гасим флагом; флаг сбрасывается при следующем pointerdown.
      island.addEventListener('click', e => {

        e.preventDefault();
        const next = clamp(targets[e.key], 0, tabs.length - 1);

          { path: 'closeDelay.tl', label: 'Возврат: верхний левый угол, задержка мс', min: 0, max: 600, step: 5 },
          { path: 'closeDelay.tr', label: 'Возврат: верхний правый угол, задержка мс', min: 0, max: 600, step: 5 },

        ...morphGroups,
        { title: 'Цвета', items: [
          { path: 'colors.page', label: 'Фон', color: true },

          { path: 'colors.yellow', label: 'Индикатор', color: true },
