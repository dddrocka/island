          { path: 'colors.greenHover', label: 'Плюс при наведении', color: true },
          { path: 'colors.sliderActive', label: 'Ползунок: заполненная часть', color: true },
          { path: 'colors.sliderInactive', label: 'Ползунок: остаток', color: true },
          { path: 'colors.sliderThumb', label: 'Ползунок: кружок', color: true },
        ]},
      ];

      const getPath = (obj, path) => path.split('.').reduce((o, k) => o[k], obj);
      function setPath(obj, path, value) {
        const keys = path.split('.');
        const last = keys.pop();
        keys.reduce((o, k) => o[k], obj)[last] = value;
      }
      const decimalsOf = item => (item.color || item.bool || item.step >= 1)
        ? 0 : String(item.step).split('.')[1].length;
      const format = (v, item) => {
        if (item.color) return v;
        if (item.bool) return v ? 'вкл' : 'выкл';
        return Number(v).toFixed(decimalsOf(item));
      };

      const fields = [];
      let fieldSeq = 0;

      // MD3-слайдер: активная часть, ручка, остаток с точкой. Позиция задаётся через --f (0..1).
      const sliderKicks = new Set();   // чтобы слайдеры подхватывали смену настроек ms.*
      function makeSlider(item, commit) {
        const el = document.createElement('div');
        el.className = 'md-slider';
        el.tabIndex = 0;
        el.setAttribute('role', 'slider');
        el.setAttribute('aria-valuemin', item.min);
        el.setAttribute('aria-valuemax', item.max);
        el.innerHTML = '<span class="ms-active"></span><span class="ms-handle"></span>' +
          '<span class="ms-inactive"><i class="ms-dot"></i></span><span class="ms-bubble"></span>';
        const bubble = el.querySelector('.ms-bubble');
        const dec = decimalsOf(item);
        let value = null;
        // Пружины: положение ручки (f) и её ширина (w) догоняют цель с отскоком. Дорожка — прямая.
        let f = 0, vf = 0, tf = 0, w = CFG.ms.handleW, vw = 0, pressed = false, raf = 0, last = 0;
        const render = () => {
          el.style.setProperty('--f', f.toFixed(5));
          el.style.setProperty('--hw', Math.max(0, w).toFixed(3) + 'px');
        };
        const tick = now => {
          raf = 0;
          if (!last) last = now;
          const el_ = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          const m = CFG.ms;
          const kf = m.moveK, cf = 2 * m.moveZ * Math.sqrt(kf);
          const kw = m.squeezeK, cw = 2 * m.squeezeZ * Math.sqrt(kw);
          const tw = pressed ? m.handleWActive : m.handleW;
          const n = Math.max(1, Math.ceil(el_ * 240));
          const dt = el_ / n;
          for (let i = 0; i < n; i++) {
            vf += (kf * (tf - f) - cf * vf) * dt; f += vf * dt;
            vw += (kw * (tw - w) - cw * vw) * dt; w += vw * dt;
          }
          if (Math.abs(tf - f) < 5e-4 && Math.abs(vf) < 5e-3 && Math.abs(tw - w) < 0.01 && Math.abs(vw) < 0.05) {
            f = tf; w = tw; vf = 0; vw = 0; last = 0; render(); return;
          }
          render();
          raf = requestAnimationFrame(tick);
        };
        const kick = () => {
          if (!CFG.ms.spring) { f = tf; w = pressed ? CFG.ms.handleWActive : CFG.ms.handleW; vf = vw = 0; render(); return; }
          if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
        };
        sliderKicks.add(kick);
        const norm = v => {
          v = clamp(v, item.min, item.max);
          v = item.min + Math.round((v - item.min) / item.step) * item.step;
          return Number(clamp(v, item.min, item.max).toFixed(dec));
        };
        const set = (v, fire) => {
          v = norm(v);
          const changed = v !== value;
          const first = value === null;
          value = v;
          tf = (v - item.min) / (item.max - item.min);
          if (first) { f = tf; render(); } else kick();
          el.setAttribute('aria-valuenow', String(v));
          bubble.textContent = format(v, item);
          if (fire && changed) commit(v);
        };
        const fromX = x => {
          const r = el.getBoundingClientRect();
          const hw = CFG.ms.handleW;
          const f = clamp((x - r.left - hw / 2) / Math.max(1, r.width - hw), 0, 1);
          set(item.min + f * (item.max - item.min), true);
        };
        let st = null;
        const begin = e => {
          st.drag = true;
          pressed = true; kick();
          el.classList.add('is-active');
          try { el.setPointerCapture(st.id); } catch (_) {}
          fromX(e.clientX);
        };
        el.addEventListener('pointerdown', e => {
          if (e.button !== 0 || !e.isPrimary) return;
          st = { id: e.pointerId, x: e.clientX, y: e.clientY, drag: false };
          // Мышью тянем сразу; пальцем ждём горизонтального движения, чтобы не мешать прокрутке списка.
          if (e.pointerType === 'mouse') begin(e);
        });
        el.addEventListener('pointermove', e => {
          if (!st || e.pointerId !== st.id) return;
          if (!st.drag) {
            const dx = Math.abs(e.clientX - st.x), dy = Math.abs(e.clientY - st.y);
            if (dx > 6 && dx > dy) begin(e);
            return;
          }
          fromX(e.clientX);
        });
        const end = e => {
          if (!st || e.pointerId !== st.id) return;
          if (!st.drag && e.type === 'pointerup') {
            fromX(e.clientX);
            pressed = true; kick();
            setTimeout(() => { pressed = false; kick(); }, 140);
          } else { pressed = false; kick(); }
          st = null;
          el.classList.remove('is-active');
        };
        el.addEventListener('pointerup', end);
        el.addEventListener('pointercancel', end);
        el.addEventListener('keydown', e => {
          const s = item.step;
          const d = { ArrowLeft: -s, ArrowDown: -s, ArrowRight: s, ArrowUp: s, PageDown: -s * 10, PageUp: s * 10 }[e.key];
          if (d !== undefined) set(value + d, true);
          else if (e.key === 'Home') set(item.min, true);
          else if (e.key === 'End') set(item.max, true);
          else return;
          e.preventDefault();
        });
        return { el, set };
      }

      function makeRow(item) {
        const row = document.createElement('div');
        row.className = 'mrow';
        const id = 'p-' + (++fieldSeq);
        const label = document.createElement('label');
        label.textContent = labelFor(item);
        label.id = id + 'l';
        const output = document.createElement('output');
        let input = null, slider = null;
        const commit = v => {
          setPath(MANUAL, item.path, item.mul ? Number((v / item.mul).toFixed(4)) : v);
          if (item.path === 'sliderProgress') S.progress = MANUAL.sliderProgress;
          output.textContent = format(v, item);
          onChange(item);
        };
        if (item.color || item.bool) {
          row.classList.add('inline');
          input = document.createElement('input');
          input.type = item.color ? 'color' : 'checkbox';
          input.id = id;
          label.htmlFor = id;
          input.addEventListener('input', () => commit(item.bool ? input.checked : input.value));
          row.append(label, input);
        } else {
          const top = document.createElement('div');
          top.className = 'mrow-top';
          top.append(label, output);
          slider = makeSlider(item, commit);
          slider.el.setAttribute('aria-labelledby', label.id);
          row.append(top, slider.el);

        const entry = { item, input, output, slider };
        fields.push(entry);
        // Строка создаётся лениво (при открытии раздела), поэтому сразу берём текущее значение из MANUAL.
        syncField(entry);
        return row;
      }

      function syncField({ item, input, output, slider }) {
        const stored = getPath(MANUAL, item.path);
        const v = item.mul ? Number((stored * item.mul).toFixed(4)) : stored;
        if (slider) slider.set(v, false);
        else if (item.bool) input.checked = !!v;
        else input.value = String(v);
        output.textContent = format(v, item);

      function syncFields() {
        fields.forEach(syncField);

      const CATS = [

            num('ms.handleWActive', 'Ширина при нажатии, px', 0, 16, 0.5),

            num('ms.handleR', 'Скругление ручки, px', 0, 16, 0.5)] },
          { title: 'Точка', items: [
            bool('ms.dotOn', 'Точка на конце'),
            num('ms.dotD', 'Диаметр точки, px', 0, 16, 0.5),
            num('ms.dotInset', 'Отступ от края, px', 0, 30, 0.5)] },
          { title: 'Цвета', items: [
            col('ms.active', 'Активная часть'),
            col('ms.handle', 'Ручка'),

            num('ms.inactiveA', 'Прозрачность остатка', 0, 1, 0.01),
            col('ms.dot', 'Точка'),

            col('ms.bubbleText', 'Подсказка: текст')] },
          { title: 'Пружина и подсказка', items: [
            bool('ms.spring', 'Пружинная анимация (отскок)'),
            num('ms.moveK', 'Упругость движения ручки', 50, 1500, 10),
            num('ms.moveZ', 'Гашение отскока движения (меньше = больше отскока)', 0.05, 1.5, 0.01),
            num('ms.squeezeK', 'Упругость сужения ручки при нажатии', 50, 1500, 10),
            num('ms.squeezeZ', 'Гашение отскока сужения (меньше = больше отскока)', 0.05, 1.5, 0.01),

        ]},
        { title: 'Система', subs: [
          { title: 'Экспорт и сброс', custom: true },

      const mpCats = document.getElementById('mpCats');
      const mpSubs = document.getElementById('mpSubs');
      const mpScroll = document.getElementById('mpScroll');

      function applyAll() {
        rebuild();
        applyCss();
        syncFields();
        refreshGeometry();
        ensureRunning();
        save();
      }

      function buildSystem() {
        const wrap = document.createElement('div');
        const mk = (text, fn) => {
          const b = document.createElement('button');
          b.type = 'button';
          b.className = 'mp-btn';
          b.textContent = text;
          b.addEventListener('click', fn);
          return b;
        };
        const box = document.createElement('pre');
        box.className = 'mp-export';
        box.hidden = true;
        // Файл: скачать/загрузить JSON. Работает даже там, где localStorage недоступен.
        const fileInput = document.createElement('input');
        fileInput.type = 'file';
        fileInput.accept = 'application/json,.json';
        fileInput.hidden = true;
        fileInput.addEventListener('change', () => {
          const f = fileInput.files && fileInput.files[0];
          if (!f) return;
          const reader = new FileReader();
          reader.onload = () => {
            try {
              const data = JSON.parse(String(reader.result));
              mergeInto(MANUAL, data);
              S.progress = MANUAL.sliderProgress;
              applyAll();
            } catch (err) {
              box.hidden = false;
              box.textContent = 'Не удалось прочитать файл: ' + err.message;
            }
            fileInput.value = '';
          };
          reader.readAsText(f);
        });
        wrap.append(
          mk('Скачать JSON', () => {
            const text = JSON.stringify(MANUAL, null, 2);
            const url = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
            const a = document.createElement('a');
            a.href = url;
            a.download = 'md3-spring-island-settings.json';
            document.body.appendChild(a);
            a.click();
            a.remove();
            setTimeout(() => URL.revokeObjectURL(url), 1000);
          }),
          mk('Загрузить JSON', () => fileInput.click()),
          mk('Показать JSON', () => {
            box.hidden = false;
            box.textContent = JSON.stringify(MANUAL, null, 2);
          }),
          mk('Сброс', () => {
            Object.assign(MANUAL, defaultsFor());
            try { localStorage.removeItem(STORE_KEY); } catch (_) {}
            S.progress = MANUAL.sliderProgress;
            applyAll();
          }),
          fileInput,
          box
        );
        return wrap;
      }

      function buildList(items) {
        const wrap = document.createElement('div');
        items.forEach(item => {
          if (item.header) {
            const h = document.createElement('div');
            h.className = 'mp-subhead';
            h.textContent = item.header;
            wrap.append(h);
          } else wrap.append(makeRow(item));
        });
        return wrap;
      }

      // Пролистывание ряда вкладок на пружине (с лёгким отскоком); касание или колесо прерывают анимацию.
      function makeSpringScroll(bar) {
        let pos = 0, vel = 0, tgt = 0, raf = 0, last = 0;
        const stop = () => { if (raf) cancelAnimationFrame(raf); raf = 0; last = 0; vel = 0; };
        const tick = now => {
          raf = 0;
          if (!last) last = now;
          const frame = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          const k = CFG.mt.scrollK, c = 2 * CFG.mt.scrollZ * Math.sqrt(k);
          const n = Math.max(1, Math.ceil(frame * 240));
          const dt = frame / n;
          for (let i = 0; i < n; i++) { vel += (k * (tgt - pos) - c * vel) * dt; pos += vel * dt; }
          if (Math.abs(tgt - pos) < 0.3 && Math.abs(vel) < 3) { bar.scrollLeft = tgt; last = 0; vel = 0; return; }
          bar.scrollLeft = pos;
          raf = requestAnimationFrame(tick);
        };
        ['pointerdown', 'wheel', 'touchstart'].forEach(ev => bar.addEventListener(ev, stop, { passive: true }));
        return {
          stop,
          to(left) {
            tgt = clamp(left, 0, Math.max(0, bar.scrollWidth - bar.clientWidth));
            if (!CFG.mt.scrollSpring || reduced) { stop(); bar.scrollLeft = tgt; return; }
            if (!raf) { pos = bar.scrollLeft; vel = 0; last = 0; raf = requestAnimationFrame(tick); }
          },
        };
      }
      const scrollers = new WeakMap();
      const scrollerFor = bar => {
        let s = scrollers.get(bar);
        if (!s) { s = makeSpringScroll(bar); scrollers.set(bar, s); }
        return s;
      };
      const centerTab = (bar, btn) => scrollerFor(bar).to(btn.offsetLeft - (bar.clientWidth - btn.offsetWidth) / 2);
      const makeTab = (text, onClick) => {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'mp-tab';
        b.setAttribute('role', 'tab');
        b.textContent = text;
        b.addEventListener('click', onClick);
        return b;
      };

      // Бегунки вкладок: пилюля (разделы) и линия (подразделы). Левый и правый край едут на своих
      // пружинах, поэтому при движении бегунок растягивается и отскакивает.
      function makeTabInd(bar, kind) {
        const el = document.createElement('i');
        el.className = 'mp-ind ' + kind;
        el.setAttribute('aria-hidden', 'true');
        let l = 0, r = 0, vl = 0, vr = 0, tl = 0, tr = 0, dir = 1, raf = 0, last = 0, ready = false;
        const draw = () => {
          el.style.transform = `translateX(${l.toFixed(2)}px)`;
          el.style.width = `${Math.max(0, r - l).toFixed(2)}px`;
        };
        const tick = now => {
          raf = 0;
          if (!last) last = now;
          const frame = Math.min((now - last) / 1000, 1 / 30);
          last = now;
          const m = CFG.mt;
          const k = kind === 'pill' ? m.pillK : m.lineK;
          const z = kind === 'pill' ? m.pillZ : m.lineZ;
          let kl = k, kr = k, zl = z, zr = z;
          if (kind === 'pill' ? m.pillStretch : m.lineStretch) {
            // задний край мягче и отстаёт — бегунок растягивается
            if (dir > 0) { kl = k * m.trail; zl = m.trailZ; } else { kr = k * m.trail; zr = m.trailZ; }
          }
          const cl = 2 * zl * Math.sqrt(kl), cr = 2 * zr * Math.sqrt(kr);
          const n = Math.max(1, Math.ceil(frame * 240));
          const dt = frame / n;
          for (let i = 0; i < n; i++) {
            vl += (kl * (tl - l) - cl * vl) * dt; l += vl * dt;
            vr += (kr * (tr - r) - cr * vr) * dt; r += vr * dt;
          }
          if (Math.abs(tl - l) < 0.05 && Math.abs(tr - r) < 0.05 && Math.abs(vl) < 0.5 && Math.abs(vr) < 0.5) {
            l = tl; r = tr; vl = vr = 0; last = 0; draw(); return;
          }
          draw();
          raf = requestAnimationFrame(tick);
        };
        const set = (btn, snap) => {
          if (!btn || !btn.offsetWidth) return;
          const inset = kind === 'line' ? CFG.mt.lineInset : 0;
          const nl = btn.offsetLeft + inset;
          const nr = btn.offsetLeft + btn.offsetWidth - inset;
          if (ready && !snap && nl === tl && nr === tr) return;
          const d = Math.sign((nl + nr) - (tl + tr));
          if (d) dir = d;
          tl = nl; tr = nr;
          if (snap || !ready || !CFG.mt.spring || reduced) {
            l = tl; r = tr; vl = vr = 0; ready = true; draw();
            return;
          }
          if (!raf) { last = 0; raf = requestAnimationFrame(tick); }
        };
        return { el, set };
      }

      const catInd = makeTabInd(mpCats, 'pill');
      const subInd = makeTabInd(mpSubs, 'line');
      let catIdx = 0;
      const subIdx = CATS.map(() => 0);
      let subBtns = [];
      let subBuilt = -1;
      const catBtns = CATS.map((c, i) => makeTab(c.title, () => { catIdx = i; renderMenu(); centerTab(mpCats, catBtns[i]); }));
      mpCats.append(catInd.el, ...catBtns);

      function placeInds(snap) {
        catInd.set(catBtns[catIdx], snap);
        if (!mpSubs.hidden) subInd.set(subBtns[subIdx[catIdx]], snap);
      }
      // Меню может быть скрыто при создании; как только вкладки получают размер — ставим бегунки на место.
      const indObserver = new ResizeObserver(() => placeInds(true));
      indObserver.observe(mpCats);
      indObserver.observe(mpSubs);

      function renderMenu() {
        catBtns.forEach((b, i) => {
          b.classList.toggle('is-active', i === catIdx);
          b.setAttribute('aria-selected', String(i === catIdx));
        });
        const cat = CATS[catIdx];
        const si = subIdx[catIdx];
        const rebuilt = subBuilt !== catIdx;
        if (rebuilt) {
          subBtns = cat.subs.map((s, i) => makeTab(s.title, () => { subIdx[catIdx] = i; renderMenu(); centerTab(mpSubs, subBtns[i]); }));
          mpSubs.replaceChildren(subInd.el, ...subBtns);
          scrollerFor(mpSubs).stop();
          mpSubs.scrollLeft = 0;
          mpSubs.hidden = cat.subs.length < 2;
          subBuilt = catIdx;
        }
        subBtns.forEach((b, i) => {
          b.classList.toggle('is-active', i === si);
          b.setAttribute('aria-selected', String(i === si));
        });
        const sub = cat.subs[si];
        if (!sub.node) sub.node = sub.custom ? buildSystem() : buildList(sub.items);
        mpScroll.replaceChildren(sub.node);
        mpScroll.scrollTop = 0;
        catInd.set(catBtns[catIdx], false);
        if (!mpSubs.hidden) subInd.set(subBtns[si], rebuilt);
      }
      renderMenu();

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape' && menuOpen) toggleIslandMenu(false);
      });

      // ---------- Старт ----------
      applyCss();
      layout();
      S.wv = CFG.sliderOn && CFG.sliderPlaying && !reduced ? 1 : 0;
      S.thumb = clamp(S.progress, 0, 1) * sliderGeom().L;
      setActive(0, true);
      placeAt(slots[0].x);
      syncFields();

      new ResizeObserver(() => {
        layout();
        if (drag) return;
        const index = Math.max(0, tabs.findIndex(t => t.dataset.tab === activeId));
        placeAt(slots[index].x);
      }).observe(island);
      ensureRunning();
    })();
